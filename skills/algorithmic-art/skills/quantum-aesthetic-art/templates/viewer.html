<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Aesthetic Artwork</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="./sketch.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      background: #171614;
      color: #f2e9d8;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 980px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      font-weight: 500;
    }

    p {
      margin: 4px 0;
      color: #cfc5b2;
      line-height: 1.6;
    }

    #canvas-container {
      margin-top: 20px;
      overflow: hidden;
      border: 1px solid rgba(242, 233, 216, 0.24);
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }
  </style>
</head>
<body>
  <main>
    <h1>Quantum Aesthetic Artwork</h1>
    <p id="seed-readout">Seed: loading…</p>
    <p>Move the pointer to bias the field. R: regenerate · S: save PNG</p>
    <div id="canvas-container"></div>
  </main>
</body>
</html>
